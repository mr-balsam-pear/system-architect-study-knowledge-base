<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="系统架构设计师个人本地学习知识库">
  <title>系统架构设计师 · 夜航指挥台</title>
  <script>
    try {
      const saved = localStorage.getItem('system-architect-study-theme');
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
        ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (_) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="学习工作区">
      <a class="app-brand" href="#/today" aria-label="回到今日指挥台"><span aria-hidden="true">SA</span><strong>冲刺指挥台<small>LOCAL STUDY OS</small></strong></a>
      <nav class="workspace-nav" aria-label="工作区导航">
        <a data-route="today" href="#/today">今日指挥台</a>
        <a data-route="knowledge" href="#/knowledge">知识点阅读器</a>
        <a data-route="practice" href="#/practice">互动题库</a>
        <a data-route="questions" href="#/questions">本机真题</a>
        <a data-route="training" href="#/training">训练中心</a>
        <a data-route="podcasts" href="#/podcasts">章节播客</a>
        <a data-route="records" href="#/records">学习档案</a>
      </nav>
      <div class="sidebar-status"><span><i aria-hidden="true"></i><b id="countdown">—</b> · 10 月 24 日</span><button id="theme-toggle" data-theme-toggle type="button" class="theme-toggle" aria-pressed="false" aria-label="切换到黑夜模式">☀️ 白天</button></div>
    </aside>
    <header class="mobile-bar"><a href="#/today">SA · 冲刺指挥台</a><div><button id="mobile-theme-toggle" data-theme-toggle type="button" class="theme-toggle" aria-pressed="false" aria-label="切换到黑夜模式">☀️ 白天</button><button id="workspace-menu" type="button" aria-controls="workspace-drawer" aria-expanded="false">工作区 ☰</button></div></header>
    <main id="workspace-root" class="workspace-root" tabindex="-1" aria-live="polite"></main>
  </div>

  <dialog id="workspace-drawer" class="workspace-drawer" aria-label="选择工作区"><button type="button" class="drawer-close" data-close-drawer>关闭</button><nav aria-label="移动端工作区导航"></nav></dialog>
  <dialog id="study-dialog" class="study-dialog" aria-labelledby="study-dialog-title"></dialog>
  <section id="podcast-mini-player" class="podcast-mini-player" hidden aria-label="章节播客迷你播放器"></section>
  <audio id="podcast-audio" preload="metadata"></audio>

  <script src="data.js"></script>
  <script src="knowledge-data.js"></script>
  <script src="practice-state.js"></script>
  <script src="podcast-state.js"></script>
  <script src="router.js"></script>
  <script src="workspace-state.js"></script>
  <script src="workspaces/today.js"></script>
  <script src="workspaces/knowledge.js"></script>
  <script src="workspaces/practice.js"></script>
  <script src="workspaces/questions.js"></script>
  <script src="workspaces/question-detail.js"></script>
  <script src="workspaces/training.js"></script>
  <script src="workspaces/podcasts.js"></script>
  <script src="workspaces/records.js"></script>
  <script src="dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
